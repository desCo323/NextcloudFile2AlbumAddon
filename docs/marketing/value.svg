<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">SakuraAlbum value overview</title>
  <desc id="desc">A visual overview of SakuraAlbum benefits for users, admins, and operations.</desc>
  <rect width="1280" height="420" fill="#f7f8fb"/>
  <text x="64" y="58" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#27252a">Warum SakuraAlbum stark ist</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 105)">
      <rect width="350" height="230" rx="16" fill="#ffffff" stroke="#d94f70" stroke-width="3"/>
      <circle cx="54" cy="54" r="26" fill="#fff0f4" stroke="#d94f70" stroke-width="3"/>
      <path d="M43 55 L52 64 L69 43" fill="none" stroke="#d94f70" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="52" font-size="23" font-weight="700" fill="#27252a">Fuer Benutzer</text>
      <text x="38" y="105" font-size="17" fill="#47454a">Ordner auswaehlen statt Pfade tippen</text>
      <text x="38" y="138" font-size="17" fill="#47454a">Visuelle Vorschau vor Schreibaktionen</text>
      <text x="38" y="171" font-size="17" fill="#47454a">Alben bleiben automatisch aktuell</text>
    </g>
    <g transform="translate(465 105)">
      <rect width="350" height="230" rx="16" fill="#ffffff" stroke="#2f7d72" stroke-width="3"/>
      <circle cx="54" cy="54" r="26" fill="#edf8f5" stroke="#2f7d72" stroke-width="3"/>
      <path d="M39 59 H69 M54 44 V74" stroke="#2f7d72" stroke-width="6" stroke-linecap="round"/>
      <text x="96" y="52" font-size="23" font-weight="700" fill="#27252a">Fuer Admins</text>
      <text x="38" y="105" font-size="17" fill="#47454a">Rollout per Gruppe steuerbar</text>
      <text x="38" y="138" font-size="17" fill="#47454a">Limits fuer Dateien, Alben und Laufzeit</text>
      <text x="38" y="171" font-size="17" fill="#47454a">Debug, CSV und Health-Diagnose</text>
    </g>
    <g transform="translate(866 105)">
      <rect width="350" height="230" rx="16" fill="#ffffff" stroke="#7357c8" stroke-width="3"/>
      <circle cx="54" cy="54" r="26" fill="#f2efff" stroke="#7357c8" stroke-width="3"/>
      <path d="M41 66 C47 44 64 44 70 66" fill="none" stroke="#7357c8" stroke-width="6" stroke-linecap="round"/>
      <path d="M44 68 H68" stroke="#7357c8" stroke-width="6" stroke-linecap="round"/>
      <text x="96" y="52" font-size="23" font-weight="700" fill="#27252a">Fuer Betrieb</text>
      <text x="38" y="105" font-size="17" fill="#47454a">Keine schweren Scans im Datei-Event</text>
      <text x="38" y="138" font-size="17" fill="#47454a">Chunking und Wiederaufnahme</text>
      <text x="38" y="171" font-size="17" fill="#47454a">Rollback- und Testprozess dokumentiert</text>
    </g>
  </g>
</svg>
